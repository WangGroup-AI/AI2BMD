load_model: null

# training settings
num_epochs: 5000
lr_warmup_steps: 1000
lr: 0.0001
lr_patience: 10
lr_min: 1.e-07
lr_factor: 0.8
weight_decay: 0.0
early_stopping_patience: 100
loss_type: MAE
loss_scale_y: 0.05
loss_scale_dy: 1.0
energy_weight: 0.05
force_weight: 0.95

# dataset specific
dataset: Pima_ft
dataset_arg: null
dataset_root: ../../../data/Trp-cage/pima_dataset_ft_pyg_100pct
derivative: True

# dataloader specific
reload: 1
batch_size: 2
inference_batch_size: 2
standardize: false
splits: null
train_size: 0.95
val_size: 0.05
test_size: null
num_workers: 12

# model architecture specific
model: ViSNetBlock
output_model: Scalar
prior_model: null

# architectural specific
embedding_dimension: 128
num_layers: 1
num_rbf: 32
activation: silu
rbf_type: expnorm
trainable_rbf: false
attn_activation: silu
num_heads: 8
cutoff: 5.0
max_z: 100
max_num_neighbors: 32
reduce_op: add
lmax: 1
vecnorm_type: max_min
trainable_vecnorm: false
vertex_type: None

# other specific
ngpus: -1
num_nodes: 1
precision: 32
log_dir: ../../../results/log_pima_ft_100pct
task: train
seed: 1
distributed_backend: ddp
redirect: false
accelerator: gpu
test_interval: null
save_interval: 1
